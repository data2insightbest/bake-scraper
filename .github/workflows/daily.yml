name: BAKE Daily Scraper

on:
  schedule:
    # Runs at 12:00 UTC (5:00 AM PT / 5:00 AM PDT) every day
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual testing in the "Actions" tab

jobs:
  scrape_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Using 3.12 for better 2026 compatibility

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          pip install playwright
          playwright install chromium --with-deps
          
      - name: Run BAKE Scraper
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py
