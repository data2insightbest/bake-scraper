name: BAKE Email Dispatcher

on:
  schedule:
    # Runs every Friday at 08:00 UTC (1:00 AM PDT)
    #- cron: '0 8 * * 5'
    # Runs exactly at 11:30 AM California Time (18:30 UTC) every Sunday
    - cron: '30 18 * * 0'
  workflow_dispatch: # This allows you to click "Run Workflow" manually in GitHub Actions

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # This command installs everything listed in your requirements.txt
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else
            # Fallback: Install essential packages if requirements.txt is missing
            pip install supabase resend
          fi

      - name: Execute Email Dispatch
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Ensure the filename below matches the script you uploaded to GitHub
        run: python send_emails.py
