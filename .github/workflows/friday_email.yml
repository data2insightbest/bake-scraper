name: BAKE Email Dispatcher

on:
  schedule:
    # Runs every Friday at 08:00 UTC (1:00 AM PDT)
    #- cron: '0 8 * * 5'
    # Runs every Sunday at 18:00 UTC (11:00 AM PDT)
    - cron: '30 18 * * 0'
  workflow_dispatch: # This allows you to click "Run Workflow" manually in GitHub Actions

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Email Dispatch
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # IMPORTANT: Replace 'send_emails.py' with the actual filename 
        # in your repo that handles the Resend/Supabase logic.
        run: python send_emails.py
        
