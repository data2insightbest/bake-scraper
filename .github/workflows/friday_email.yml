name: Send Friday BAKE Email

on:
  schedule:
    # This runs every Friday at 8:00 AM UTC (approx. 1:00 AM PDT)
    #- cron: '0 8 * * 5'
    - cron: '0 11 * * 0'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  send-email:
    runs-on: ubuntu-latest
    
    # Update this if your code is in a subfolder (e.g., ./scraper-folder)
    # defaults:
    #   run:
    #     working-directory: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.10'
          cache: 'pip' # Speeds up future runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Playwright is required if your email script needs to scrape fresh data
          python -m playwright install --with-deps chromium

      - name: Run Friday Email Script
        env:
          # These must match the names in your GitHub Repo > Settings > Secrets
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # If you use Resend or another mailer, add that secret here:
          # RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scraper.py # Change this if the file is named send_email.py
        
